# Manual packaging only: no deployment target is defined yet (deploy is optional per constitution).
# Add a deploy job here once the team picks a host and stores credentials as environment secrets.
name: CD (package)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build release archive
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Archive runtime files (no local config, docs or tests)
        run: git archive --format=zip -o the-news-uth.zip HEAD app config/config.example.php database public views
      - uses: actions/upload-artifact@v7
        with:
          name: the-news-uth-${{ github.sha }}
          path: the-news-uth.zip
          retention-days: 14
